name: Tests

# Fast PR gate — runs the same checks a contributor runs locally (typecheck,
# vitest, cargo test). Deliberately does NOT build the Tauri bundle: that's
# what build.yml does on tag push, and it takes ~15 minutes per platform.
# Tests cover the model-layer logic that drives correctness; the bundle build
# only exercises packaging.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs for the same PR when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Cache the Cargo target dir so cold builds aren't on every PR.
      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Tauri-on-Linux dev deps. We don't `tauri build` here, but `cargo test`
      # links against tauri's webview crate which pulls in these system libs
      # via tauri-utils. Cheap on a hot CI runner.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm install

      # Cache the embedded Python runtime so we don't redownload + reinstall
      # pywr on every test run. Key is keyed off the setup script — bumping the
      # pinned versions in the script invalidates the cache automatically.
      - name: Cache embedded Python runtime
        id: cache-pyrt
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/python-runtime
          key: pyrt-${{ runner.os }}-${{ hashFiles('scripts/setup-python-runtime.sh') }}

      # Tauri's build script validates `bundle.resources` globs at compile time
      # — without the runtime staged, even `cargo test` fails with "glob pattern
      # resources/python-runtime/**/* path not found". We run the full setup
      # rather than a stub so the test suite exercises the same Python tree the
      # release build will ship.
      - name: Set up Python runtime
        if: steps.cache-pyrt.outputs.cache-hit != 'true'
        run: npm run setup:python

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest (frontend)
        run: npm test

      - name: Cargo test (Tauri backend)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
